name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑静态分析和测试，四端构建都依赖它 —— 一个类型错误不该浪费四个平台的
  # 编译时间，也避免把「能编译但一跑就崩」的包发出去。
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  linux:
    name: Linux x64
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev g++

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/wb-pro-linux-x64.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: wb-pro-linux-x64
          path: wb-pro-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath wb-pro-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wb-pro-windows-x64
          path: wb-pro-windows-x64.zip
          if-no-files-found: error

  # 用 Intel 镜像：产物是 x86_64 的 .app，Apple Silicon 上靠 Rosetta 2 也能跑，
  # 反过来 arm64 包在 Intel Mac 上则完全跑不起来。另外 macos-latest 的 arm64
  # 池子常年排队，Intel 镜像通常能更快拿到 runner。
  macos:
    name: macOS x64
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/wb-pro.app" \
            wb-pro-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wb-pro-macos-x64
          path: wb-pro-macos.zip
          if-no-files-found: error

  android:
    name: Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Flutter 的 Gradle 插件会在配置阶段按 flutter.ndkVersion 自动装 NDK。
      # 那个包接近 1 GB，GitHub 的 runner 偶尔会把它下成半截 zip 并直接失败
      # （Error reading Zip content from a SeekableByteChannel），重跑一般就好。
      # 所以这里单独装、失败就删干净重来，别把损坏的目录留给后面的构建。
      - name: Install NDK (with retry)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK="ndk;28.2.13676358"
          for attempt in 1 2 3; do
            echo "::group::sdkmanager 安装 $NDK（第 $attempt 次）"
            if yes | "$SDKMANAGER" --install "$NDK"; then
              echo "::endgroup::"
              echo "NDK 就绪"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::NDK 第 $attempt 次安装失败，清理残留后重试"
            rm -rf "${ANDROID_HOME:?}/ndk/28.2.13676358"
            sleep 15
          done
          echo "::error::NDK 连续三次安装失败"
          exit 1

      # release 包暂时用 debug 签名，方便直接侧载安装；
      # 上架前请在 android/app/build.gradle.kts 里换成正式签名。
      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: wb-pro-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show collected files
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
