name: wb_pro
description: "wb-pro —— 跨平台无限画布白板。手绘、形状、箭头、文本、便签、图片，支持 .wbpro 文档、PNG/SVG 导出与自动保存。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 系统文件对话框：桌面走 GTK/Win32/Cocoa，Android 走 SAF。
  file_selector: ^1.0.3
  # 自动保存目录。桌面是 XDG/Documents，Android 是应用私有目录。
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
